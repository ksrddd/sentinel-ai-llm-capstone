[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "0.1.0"
description = "SentinelAI - LLM-powered SOC incident triage copilot (university capstone prototype)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "openai>=1.40",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
]
neural = [
    "sentence-transformers>=3.0",
]
report = [
    "reportlab>=4.0",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: requires the class LLM proxy (OPENAI_API_KEY / OPENAI_BASE_URL); skipped by default",
    "neural: requires the optional sentence-transformers dependency",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"eval/*" = ["E501"]
"scripts/*" = ["E501"]
